<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辣妹文旦團</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; margin-bottom: 5px; }
        
        .description { text-align: center; color: #737373; font-weight: bold; margin-top: 0; margin-bottom: 20px; font-size: 1.1em; }
        .warning-text { color: #d9534f; font-size: 0.85em; font-weight: normal; display: block; margin-top: 8px; line-height: 1.5; text-align: left; background: #fdf2f2; padding: 10px; border-radius: 4px; border-left: 4px solid #d9534f;}
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        .required-star { color: red; }
        
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        
        .checkbox-group { display: flex; align-items: center; background-color: #f9f9f9; padding: 12px; border-radius: 4px; border: 1px solid #ddd; margin-bottom: 15px; }
        .checkbox-group input { width: auto; margin-right: 10px; transform: scale(1.3); }
        .checkbox-group label { margin-bottom: 0; cursor: pointer; color: #444; font-weight: normal; }
        
        #recipientSection { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ccc; }
        
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        
        #statusMessage { text-align: center; margin-top: 15px; font-weight: bold; }
        
        /* 成功畫面區塊 */
        #successScreen { display: none; text-align: center; padding: 20px 0; }
        #successScreen h2 { color: #28a745; margin-bottom: 20px; }
        #submittedDataContainer { display: flex; justify-content: center; margin-bottom: 25px; }
        #submittedData { text-align: left; color: #444; font-size: 1.05em; line-height: 1.8; background: #f9f9f9; padding: 15px 25px; border-radius: 8px; border: 1px solid #eee; width: 100%; }
        .btn-gray { background-color: #555555; color: white; width: auto; padding: 10px 40px; display: inline-block; }
        .btn-gray:hover { background-color: #333333; }
        
        /* 新增：結單畫面區塊 */
        #closedScreen { display: none; text-align: center; padding: 40px 0; }
        #closedScreen h2 { color: #d9534f; margin-bottom: 15px; }
        #closedScreen p { color: #555; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <h1>辣妹文旦團</h1>
    
    <!-- 表單與說明區塊 -->
    <div id="formSection">
        <div class="description" id="formDesc">
            一盒十斤含運費900元
            <span class="warning-text">
                ⚠️ 一個寄送地址請填寫一份訂單。多個地址請分次填寫。<br>
                ⚠️ 訂單送出後若需修改，請重新填寫，並於備註註明「取消前單」。
            </span>
        </div>
        
        <form id="orderForm">
            <div class="form-group">
                <label for="purchaserName">訂購人姓名 <span class="required-star">*</span></label>
                <input type="text" id="purchaserName" name="purchaserName" required>
            </div>
            <div class="form-group">
                <label for="purchaserPhone">訂購人電話 <span class="required-star">*</span></label>
                <input type="tel" id="purchaserPhone" name="purchaserPhone" pattern="[0-9]*" inputmode="numeric" required>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="sameAsPurchaser" checked>
                <label for="sameAsPurchaser">收件人與訂購人相同</label>
            </div>

            <div id="recipientSection">
                <div class="form-group">
                    <label for="recipientName">收件人姓名 <span class="required-star">*</span></label>
                    <input type="text" id="recipientName" name="recipientName">
                </div>
                <div class="form-group">
                    <label for="recipientPhone">收件人電話 <span class="required-star">*</span></label>
                    <input type="tel" id="recipientPhone" name="recipientPhone" pattern="[0-9]*" inputmode="numeric">
                </div>
            </div>

            <div class="form-group">
                <label for="address">收件地址 <span class="required-star">*</span></label>
                <input type="text" id="address" name="address" required>
            </div>
            
            <div class="form-group">
                <label for="quantity">數量 <span class="required-star">*</span></label>
                <select id="quantity" name="quantity" required>
                    <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                    <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                    <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                    <option value="10">10</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="remarks">備註</label>
                <textarea id="remarks" name="remarks" rows="3" placeholder="如有其他需求請填寫於此..."></textarea>
            </div>
            
            <button type="submit" id="submitBtn">送出訂單</button>
            <div id="statusMessage"></div>
        </form>
    </div>

    <!-- 成功畫面區塊 -->
    <div id="successScreen">
        <h2>🎉 訂單已成功送出！</h2>
        <div id="submittedDataContainer">
            <div id="submittedData"></div>
        </div>
        <button id="resetFormBtn" class="btn-gray">再填寫一筆訂單</button>
    </div>
    
    <!-- 結單畫面區塊 -->
    <div id="closedScreen">
        <div style="font-size: 50px; margin-bottom: 10px;">🛑</div>
        <h2>本次團購已結單</h2>
        <p>感謝大家對「辣妹文旦團」的支持！<br>目前已截止訂購。</p>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyDKIG597zkFzv6mSjon6Sem1l8ZIhlwjX9blERNsNXs-_JXIueWTrJVH-eDFQ_r_zoyw/exec'; 
    
    const formSection = document.getElementById('formSection');
    const form = document.getElementById('orderForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');
    const successScreen = document.getElementById('successScreen');
    const closedScreen = document.getElementById('closedScreen');
    const resetFormBtn = document.getElementById('resetFormBtn');
    
    const sameAsPurchaserCheckbox = document.getElementById('sameAsPurchaser');
    const recipientSection = document.getElementById('recipientSection');
    const recipientNameInput = document.getElementById('recipientName');
    const recipientPhoneInput = document.getElementById('recipientPhone');

    sameAsPurchaserCheckbox.addEventListener('change', function() {
        if (this.checked) {
            recipientSection.style.display = 'none';
        } else {
            recipientSection.style.display = 'block';
        }
    });

    form.addEventListener('submit', e => {
        e.preventDefault(); 

        let purchaserNameVal = document.getElementById('purchaserName').value.trim();
        let purchaserPhoneVal = document.getElementById('purchaserPhone').value.trim();
        let addressVal = document.getElementById('address').value.trim();
        let qtyVal = document.getElementById('quantity').value;
        let remarksVal = document.getElementById('remarks').value.trim();
        
        let recipientNameVal = '';
        let recipientPhoneVal = '';

        if (sameAsPurchaserCheckbox.checked) {
            recipientNameVal = purchaserNameVal;
            recipientPhoneVal = purchaserPhoneVal;
        } else {
            recipientNameVal = recipientNameInput.value.trim();
            recipientPhoneVal = recipientPhoneInput.value.trim();
            if (!recipientNameVal || !recipientPhoneVal) {
                alert("請填寫收件人姓名與電話！");
                return;
            }
        }

        if (!purchaserNameVal || !purchaserPhoneVal || !addressVal) {
            alert("請確實填寫所有必填欄位！");
            return; 
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "傳送中...";
        statusMessage.style.color = "#737373";
        statusMessage.textContent = "資料處理中...";

        let requestBody = new FormData(form);
        requestBody.set('recipientName', recipientNameVal);
        requestBody.set('purchaserPhone', "'" + purchaserPhoneVal);
        requestBody.set('recipientPhone', "'" + recipientPhoneVal);

        // 移除 mode: 'no-cors'，改用標準請求以便讀取 JSON 回應
        fetch(scriptURL, { method: 'POST', body: requestBody })
            .then(response => response.json())
            .then(data => {
                // 如果後端檢查開關發現已結單
                if (data.result === "closed") {
                    formSection.style.display = 'none';
                    closedScreen.style.display = 'block';
                    return; // 終止後續動作
                }
                
                // 如果成功寫入
                const amountVal = parseInt(qtyVal, 10) * 900;
                formSection.style.display = 'none';
                
                let resultHTML = `
                    <b>訂購人：</b>${purchaserNameVal}<br>
                    <b>收件人：</b>${recipientNameVal}<br>
                    <b>寄送至：</b>${addressVal}<br>
                    <b>訂購：</b>${qtyVal}盒 ${amountVal}元
                `;
                if (remarksVal !== '') {
                    resultHTML += `<br><b>備註：</b>${remarksVal.replace(/\n/g, '<br>')}`;
                }

                document.getElementById('submittedData').innerHTML = resultHTML;
                successScreen.style.display = 'block';
                
                form.reset(); 
                recipientSection.style.display = 'none';
                statusMessage.textContent = ""; 
                submitBtn.disabled = false;
                submitBtn.textContent = "送出訂單"; 
            })
            .catch(error => {
                statusMessage.style.color = "red";
                statusMessage.textContent = "發生錯誤，請檢查網路。";
                submitBtn.disabled = false;
                submitBtn.textContent = "送出訂單";
            });
    });

    resetFormBtn.addEventListener('click', () => {
        successScreen.style.display = 'none';
        formSection.style.display = 'block';
    });
</script>

</body>
</html>
