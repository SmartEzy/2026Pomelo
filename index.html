<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辣妹文旦團</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; margin-bottom: 5px; }
        /* 說明文字改為純灰色 */
        .description { text-align: center; color: #737373; font-weight: bold; margin-top: 0; margin-bottom: 20px; font-size: 1.1em; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        .required-star { color: red; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        /* 按鈕改為藍色 (#007bff) */
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        /* 按鈕滑鼠移過去的顏色 (深藍色 #0056b3) */
        button:hover { background-color: #0056b3; }
        
        #statusMessage { text-align: center; margin-top: 15px; font-weight: bold; }
        
        /* 成功畫面的樣式 */
        #successScreen { display: none; text-align: center; padding: 20px 0; }
        #successScreen h2 { color: #28a745; margin-bottom: 10px; }
        #successScreen p { color: #555; margin-bottom: 20px; }
        /* 成功畫面的返回按鈕改為純灰色外框 (保持原樣) */
        .btn-outline { background-color: white; color: #737373; border: 2px solid #737373; }
        .btn-outline:hover { background-color: #f4f4f9; color: #595959; border-color: #595959; }
    </style>
</head>
<body>

<div class="container">
    <h1>辣妹文旦團</h1>
    <p class="description" id="formDesc">一盒十斤含運費900元</p>
    
    <!-- 表單區塊 -->
    <form id="orderForm">
        <div class="form-group">
            <label for="name">姓名 <span class="required-star">*</span></label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="quantity">數量 <span class="required-star">*</span></label>
            <select id="quantity" name="quantity" required>
                <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                <option value="10">10</option>
            </select>
        </div>
        <div class="form-group">
            <label for="address">地址 <span class="required-star">*</span></label>
            <input type="text" id="address" name="address" required>
        </div>
        <div class="form-group">
            <label for="phone">電話 <span class="required-star">*</span></label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]*" inputmode="numeric" required>
        </div>
        <div class="form-group">
            <label for="remarks">備註</label>
            <textarea id="remarks" name="remarks" rows="3" placeholder="如有其他需求請填寫於此..."></textarea>
        </div>
        <button type="submit" id="submitBtn">送出訂單</button>
        <div id="statusMessage"></div>
    </form>

    <!-- 成功畫面區塊 (預設隱藏) -->
    <div id="successScreen">
        <h2>🎉 訂單已成功送出！</h2>
        <p>我們已收到您的訂購資訊，感謝您的支持。</p>
        <button id="resetFormBtn" class="btn-outline">再填寫一筆訂單</button>
    </div>
</div>

<script>
    // 已經幫你替換成你提供的最新部署網址
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyDKIG597zkFzv6mSjon6Sem1l8ZIhlwjX9blERNsNXs-_JXIueWTrJVH-eDFQ_r_zoyw/exec'; 
    
    const form = document.getElementById('orderForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');
    const successScreen = document.getElementById('successScreen');
    const formDesc = document.getElementById('formDesc');
    const resetFormBtn = document.getElementById('resetFormBtn');

    form.addEventListener('submit', e => {
        e.preventDefault(); 

        const nameVal = document.getElementById('name').value.trim();
        const qtyVal = document.getElementById('quantity').value;
        const addressVal = document.getElementById('address').value.trim();
        const phoneVal = document.getElementById('phone').value.trim();

        if (!nameVal || !qtyVal || !addressVal || !phoneVal) {
            alert("請確實填寫：姓名、數量、地址與電話！");
            return; 
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "傳送中...";
        statusMessage.style.color = "#737373"; // 傳送中提示字也改為灰色
        statusMessage.textContent = "訂單送出中，請稍候...";

        let requestBody = new FormData(form);

        fetch(scriptURL, { method: 'POST', body: requestBody })
            .then(response => {
                // 成功送出後：隱藏表單、顯示成功畫面
                form.style.display = 'none';
                formDesc.style.display = 'none';
                successScreen.style.display = 'block';
                
                // 將表單狀態還原，以便下次填寫
                form.reset(); 
                statusMessage.textContent = ""; 
                submitBtn.disabled = false;
                submitBtn.textContent = "送出訂單"; 
            })
            .catch(error => {
                statusMessage.style.color = "red";
                statusMessage.textContent = "發生錯誤，請稍後再試。";
                submitBtn.disabled = false;
                submitBtn.textContent = "送出訂單";
                console.error('Error!', error.message);
            });
    });

    // 點擊「再填寫一筆訂單」按鈕時：恢復表單顯示
    resetFormBtn.addEventListener('click', () => {
        successScreen.style.display = 'none';
        form.style.display = 'block';
        formDesc.style.display = 'block';
    });
</script>

</body>
</html>
