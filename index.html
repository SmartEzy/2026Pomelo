<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辣妹文旦團</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; margin-bottom: 5px; }
        /* 新增商品說明的樣式 */
        .description { text-align: center; color: #d9534f; font-weight: bold; margin-top: 0; margin-bottom: 20px; font-size: 1.1em; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
        #statusMessage { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>辣妹文旦團</h1>
    <!-- 在這裡新增了商品說明 -->
    <p class="description">一盒十斤含運費900元</p>
    
    <form id="orderForm">
        <!-- 姓名 -->
        <div class="form-group">
            <label for="name">姓名：</label>
            <input type="text" id="name" name="name" required>
        </div>

        <!-- 數量 (下拉選單 1-10) -->
        <div class="form-group">
            <label for="quantity">數量：</label>
            <select id="quantity" name="quantity" required>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
            </select>
        </div>

        <!-- 地址 -->
        <div class="form-group">
            <label for="address">地址：</label>
            <input type="text" id="address" name="address" required>
        </div>

        <!-- 電話 (預設數字鍵盤) -->
        <div class="form-group">
            <label for="phone">電話：</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]*" inputmode="numeric" required>
        </div>

        <!-- 備註 -->
        <div class="form-group">
            <label for="remarks">備註：</label>
            <textarea id="remarks" name="remarks" rows="3"></textarea>
        </div>

        <button type="submit" id="submitBtn">送出訂購</button>
    </form>
    <div id="statusMessage"></div>
</div>

<script>
    // ！！！請將下方的網址替換成你的 Google Apps Script 部署網址 ！！！
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyDKIG597zkFzv6mSjon6Sem1l8ZIhlwjX9blERNsNXs-_JXIueWTrJVH-eDFQ_r_zoyw/exec'; 
    
    const form = document.getElementById('orderForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', e => {
        e.preventDefault(); 
        submitBtn.disabled = true;
        statusMessage.style.color = "blue";
        statusMessage.textContent = "表單送出中，請稍候...";

        let requestBody = new FormData(form);

        fetch(scriptURL, { method: 'POST', body: requestBody })
            .then(response => {
                statusMessage.style.color = "green";
                statusMessage.textContent = "訂單已成功送出！";
                form.reset(); 
                submitBtn.disabled = false;
            })
            .catch(error => {
                statusMessage.style.color = "red";
                statusMessage.textContent = "發生錯誤，請稍後再試。";
                submitBtn.disabled = false;
                console.error('Error!', error.message);
            });
    });
</script>

</body>
</html>
